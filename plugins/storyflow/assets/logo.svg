<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="storyflow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="sf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8B5CF6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0B0F19"/>
  
  <!-- Flow nodes -->
  <circle cx="36" cy="42" r="14" fill="#3B82F6" filter="url(#sf-glow)"/>
  <circle cx="92" cy="42" r="14" fill="#8B5CF6" filter="url(#sf-glow)"/>
  <circle cx="64" cy="88" r="16" fill="#EC4899" filter="url(#sf-glow)"/>

  <!-- Connecting bezier curves -->
  <path d="M48 42 C64 42 64 80 64 74" fill="none" stroke="url(#storyflow-grad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M80 42 C64 42 64 80 64 74" fill="none" stroke="url(#storyflow-grad)" stroke-width="4" stroke-linecap="round"/>
  
