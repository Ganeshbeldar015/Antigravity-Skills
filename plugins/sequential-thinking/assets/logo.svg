<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="seq-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="seq-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0A0F1D"/>
  
  <!-- Neural Reasoning Steps -->
  <circle cx="32" cy="64" r="12" fill="#10B981" filter="url(#seq-glow)"/>
  <circle cx="64" cy="40" r="14" fill="#06B6D4" filter="url(#seq-glow)"/>
  <circle cx="64" cy="88" r="12" fill="#3B82F6" filter="url(#seq-glow)"/>
  <circle cx="96" cy="64" r="14" fill="#6366F1" filter="url(#seq-glow)"/>

  <!-- Connecting Lines -->
  <line x1="32" y1="64" x2="64" y2="40" stroke="url(#seq-grad)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="64" x2="64" y2="88" stroke="url(#seq-grad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3"/>
  <line x1="64" y1="40" x2="96" y2="64" stroke="url(#seq-grad)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="64" y1="88" x2="96" y2="64" stroke="url(#seq-grad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Node Numbers -->
  <text x="32" y="68" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="64" y="44" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="64" y="92" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2b</text>
  <text x="96" y="68" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
</svg>
